<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inventionistas Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root { --bg: #0b0b0d; --ink: #e9e8ec; --spark: #a78bfa; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Space Mono", monospace;
  }
  .stage { width: 340px; height: 340px; display: grid; place-items: center; }
  svg.loader { width: 240px; height: 264px; overflow: visible; }
  .cap { margin-top: 16px; font-size: 12px; letter-spacing: 0.26em; text-transform: uppercase; color: #7a7985; min-height: 16px; }
  .cap b { color: var(--spark); font-weight: 700; }
  .controls { position: fixed; bottom: 26px; display: flex; gap: 10px; }
  button {
    font-family: "Space Mono", monospace; font-size: 12px; letter-spacing: 0.08em;
    color: var(--ink); background: transparent; border: 1px solid rgba(255,255,255,0.2);
    padding: 9px 16px; border-radius: 8px; cursor: pointer; transition: border-color .25s, background .25s;
  }
  button:hover { border-color: var(--spark); background: rgba(167,139,250,0.08); }
  .hint { position: fixed; top: 22px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #46454f; }
</style>
</head>
<body>
  <div class="hint">Inventionistas · loader concept</div>

  <div class="stage">
    <svg class="loader" viewBox="0 0 40 44" fill="none" aria-label="Inventionistas loading">
      <g id="mark">
        <g id="bulb">
          <circle cx="20" cy="16" r="11" stroke="#e9e8ec" stroke-width="1.7"/>
          <line x1="14" y1="30.5" x2="26" y2="30.5" stroke="#e9e8ec" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M17.5 33.5 h5 l-1 3.5 h-3 Z" fill="#e9e8ec"/>
        </g>
        <!-- single solid sparkle, centered in the bulb -->
        <path id="sparkle" d="M20 9 L21.77 14.23 L27 16 L21.77 17.77 L20 23 L18.23 17.77 L13 16 L18.23 14.23 Z" fill="#a78bfa"/>
      </g>
    </svg>
  </div>

  <div class="cap" id="cap">&nbsp;</div>

  <div class="controls"><button id="replay">Replay</button></div>

<script>
(function () {
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cap = document.getElementById("cap");
  function setPct(v) { cap.innerHTML = "<b>" + Math.round(v) + "</b>%"; }

  function reset() {
    gsap.set("#bulb", { opacity: 0, transformOrigin: "20px 23px", scale: 0.85 });
    gsap.set("#sparkle", { opacity: 0, scale: 0, rotation: 360, svgOrigin: "20 16" });
    gsap.set("#mark", { y: 0, scaleX: 1, scaleY: 1, svgOrigin: "20 38" });
    setPct(0);
  }

  function build() {
    var tl = gsap.timeline({ onComplete: function () { gsap.delayedCall(0.9, play); } });

    tl.to("#bulb", { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 0);

    // grow 0 -> 100% while spinning
    tl.to("#sparkle", { opacity: 1, scale: 1, rotation: 0, duration: 0.8, ease: "back.out(2.2)" }, 0.3);
    tl.to({ v: 0 }, { v: 100, duration: 0.9, ease: "power1.out", onUpdate: function () { setPct(this.targets()[0].v); } }, 0.3);

    // the jump: squat, hop, land with squash + bounce
    tl.to("#mark", { scaleY: 0.86, scaleX: 1.1, duration: 0.12, ease: "power2.out" }, 1.08)
      .to("#mark", { y: -13, scaleY: 1.12, scaleX: 0.94, duration: 0.22, ease: "power2.out" }, 1.2)
      .to("#mark", { y: 0, scaleY: 0.9, scaleX: 1.08, duration: 0.16, ease: "power2.in" }, 1.42)
      .to("#mark", { scaleY: 1, scaleX: 1, duration: 0.45, ease: "elastic.out(1,0.5)" }, 1.58);

    // little ignite pop on landing (no flash, stays clean)
    tl.to("#sparkle", { scale: 1.24, duration: 0.12, ease: "power2.out", svgOrigin: "20 16" }, 1.42)
      .to("#sparkle", { scale: 1, duration: 0.4, ease: "elastic.out(1,0.5)", svgOrigin: "20 16" }, 1.54);

    tl.add(function () { cap.innerHTML = "Inventionistas"; }, 1.7);
    return tl;
  }

  function play() { reset(); build(); }

  if (reduce) {
    reset();
    gsap.set("#bulb", { opacity: 1, scale: 1 });
    gsap.set("#sparkle", { opacity: 1, scale: 1, rotation: 0 });
    cap.innerHTML = "Inventionistas";
  } else { play(); }

  document.getElementById("replay").addEventListener("click", play);
})();
</script>
</body>
</html>
