<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SG test</title>
<style>html,body{margin:0;height:100%;background:#f4f1ea}#sg-root{position:fixed;inset:0}</style>
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
  "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
  "react-dom": "https://esm.sh/react-dom@18.3.1",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
  "three": "https://esm.sh/three@0.153.0",
  "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.13.0?external=react,react-dom,three",
  "@shadergradient/react": "https://esm.sh/@shadergradient/react@2.0.9?external=react,react-dom,three,@react-three/fiber"
}}
</script>
</head>
<body>
<div id="sg-root"></div>
<script type="module">
  try {
    const React = (await import('react')).default;
    const { createRoot } = await import('react-dom/client');
    const { ShaderGradientCanvas, ShaderGradient } = await import('@shadergradient/react');
    const e = React.createElement;
    const root = createRoot(document.getElementById('sg-root'));
    root.render(
      e(ShaderGradientCanvas, { style: { position: 'absolute', inset: 0 }, gl: { preserveDrawingBuffer: true } },
        e(ShaderGradient, {
          control: 'query',
          urlString: 'https://www.shadergradient.co/customize?animate=on&axesHelper=off&bgColor1=%23ffffff&bgColor2=%23ffffff&brightness=1.3&cAzimuthAngle=180&cDistance=3&cPolarAngle=90&cameraZoom=1&color1=%231e1247&color2=%238b5cf6&color3=%23ec4899&destination=onCanvas&embedMode=off&envPreset=city&format=gif&fov=45&frameRate=10&grain=off&lightType=3d&pixelDensity=1&positionX=0&positionY=0&positionZ=0&range=enabled&rangeEnd=40&rangeStart=0&reflection=0.1&rotationX=0&rotationY=10&rotationZ=50&shader=defaults&type=waterPlane&uDensity=1.4&uFrequency=5.5&uSpeed=0.4&uStrength=2&uTime=0&wireframe=false'
        })
      )
    );
    window.__sgOK = true;
  } catch (err) {
    window.__sgErr = String(err && err.stack || err);
    console.warn('SG failed:', err);
  }
</script>
</body>
</html>
